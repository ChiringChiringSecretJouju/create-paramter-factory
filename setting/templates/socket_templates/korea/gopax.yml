# Gopax 웹소켓 API 템플릿
# 참고 문서: https://gopax.github.io/wsapi/
# 엔드포인트: wss://wsapi.gopax.co.kr

_common: &BASE
  n: "SubscribeToTickers"
  o: {}

_common_unsub: &BASE_UNSUB
  n: "UnsubscribeToTickers"
  o: {}

ticker:
  <<: *BASE

orderbook:
  n: "SubscribeToOrderBooks"
  o:
    tradingPairNames:
      - "{gopax_market}"

unsubscribe_ticker:
  <<: *BASE_UNSUB

unsubscribe_orderbook:
  n: "UnsubscribeToOrderBooks"
  o:
    tradingPairNames:
      - "{gopax_market}"

# 참고:
# 1. Gopax WebSocket 엔드포인트: wss://wsapi.gopax.co.kr
# 2. Ticker 메시지: {"n": "SubscribeToTickers", "o": {}} (전체 티커 일괄 구독)
# 3. Orderbook 메시지: {"n": "SubscribeToOrderBooks", "o": {"tradingPairNames": ["BTC-KRW"]}}
# 4. {gopax_market}: 마켓 형식은 BTC-KRW (대문자 하이픈)
# 5. Ticker는 전체 구독 후 클라이언트 측에서 tradingPairName 필터링
# 6. Delta 응답 구조: {"i": -1, "n": "TickerEvent", "o": {"BTC-KRW": {...}}}
