# Gate.io 웹소켓 API 템플릿
# 참고 문서: https://www.gate.io/docs/developers/apiv4/ws/en/

_common: &BASE
  time: "{epoch_sec}"
  event: "subscribe"

_common_unsub: &BASE_UNSUB
  time: "{epoch_sec}"
  event: "unsubscribe"

ticker:
  <<: *BASE
  channel: "spot.tickers"
  payload: "{gateio_pairs}"  # 예시 값: ["BTC_USDT", "ETH_USDT"]
  # 참고: Gate.io는 spot.tickers 채널을 통해 실시간 가격 정보 제공

orderbook:
  <<: *BASE
  channel: "spot.order_book"
  payload: "{gateio_pairs}"  # 예시 값: ["BTC_USDT", "ETH_USDT"]
  # 참고: spot.order_book 채널은 오더북 변경사항을 실시간으로 제공

unsubscribe_ticker:
  <<: *BASE_UNSUB
  channel: "spot.tickers"
  payload: "{gateio_pairs}"

unsubscribe_orderbook:
  <<: *BASE_UNSUB
  channel: "spot.order_book"
  payload: "{gateio_pairs}"

# Gate.io 웹소켓은 다음 구독 채널도 지원합니다:
# - spot.trades: 실시간 거래 정보
# - spot.candlesticks: 캔들스틱 차트 데이터
# - spot.book_ticker: 최고 매수/매도 호가 정보
