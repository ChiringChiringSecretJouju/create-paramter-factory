# Bybit v5 Spot WebSocket API
# Docs: https://bybit-exchange.github.io/docs/v5/ws/connect
# Format: {"op": "subscribe", "args": ["publicTrade.BTCUSDT"], "req_id": "..."}

ticker:
  op: "subscribe"
  args: []  # 코드에서 동적 생성: ["tickers.BTCUSDT"]
  req_id: "{req_id}"

trade:
  op: "subscribe"
  args: []  # 코드에서 동적 생성: ["publicTrade.BTCUSDT"]
  req_id: "{req_id}"

orderbook:
  op: "subscribe"
  args: []  # 코드에서 동적 생성: ["orderbook.50.BTCUSDT"]
  req_id: "{req_id}"

unsubscribe_ticker:
  op: "unsubscribe"
  args: []
  req_id: "{req_id}"

unsubscribe_trade:
  op: "unsubscribe"
  args: []
  req_id: "{req_id}"

unsubscribe_orderbook:
  op: "unsubscribe"
  args: []
  req_id: "{req_id}"
