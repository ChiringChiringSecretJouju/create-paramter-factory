upbit:
  parameter:
    - code
    - trade_timestamp
    - opening_price    # 시가
    - trade_price
    - high_price
    - low_price
    - acc_trade_volume_24h

bithumb:
  parameter:
    - code
    - timestamp
    - opening_price    # 시가
    - trade_price
    - high_price
    - low_price
    - acc_trade_volume_24h

coinone:
  parameter:
    - target_currency
    - timestamp
    - first
    - high
    - low
    - last
    - target_volume

korbit:
  parameter:
    - symbol
    - timestamp
    - open            # 시가
    - close
    - high
    - low
    - volume


binance:
  parameter:
    - s           # symbol
    - E           # event_time (ms)
    - o           # open price (24h)
    - c           # last_price
    - h           # high_price_24h
    - l           # low_price_24h
    - v           # volume_24h (base)

coinbase:
  parameter:
    - product_id      # symbol
    - time            # ISO8601
    - open_24h       # open price (24h)
    - price           # last_price
    - high_24h
    - low_24h
    - volume_24h      # base volume (24h)

bybit:
  parameter:
    - symbol
    - ts              # timestamp (ms)
    - prevPrice24h    # open proxy (24h open)
    - lastPrice
    - highPrice24h
    - lowPrice24h
    - volume24h       # base volume

okx:
  parameter:
    - instId
    - ts              # timestamp (ms)
    - open24h        # open price (24h)
    - last
    - high24h
    - low24h
    - vol24h          # base volume

kraken:
  parameter:
    - symbol          # e.g., "BTC/USD"
    - o               # open price (24h)
    - last            # last trade price
    - high            # 24h high
    - low             # 24h low
    - vol24h          # 24h volume (base)

gateio:
  parameter:
    - currency_pair
    - time            # epoch (sec)
    - last
    - high
    - low
    - base_volume     # 24h

huobi:
  parameter:
    - symbol
    - ts              # ms
    - open
    - close
    - high
    - low
    - amount          # 24h base volume

bitfinex:
  parameter:
    - symbol          # 구독시 pair (예: tBTCUSD)
    - last_price
    - high            # 24h
    - low             # 24h
    - volume          # 24h (base)

mexc:
  parameter:
    - symbol
    - sendTime                      # timestamp
    - price                         # trade_price (시가 없음)
    - high
    - low
    - quantity                      # acc_trade_volume_24h

gopax:
  parameter:
    - tradingPairName
    - lastTraded         # timestamp
    - open               # 시가
    - last               # 현재가
    - high               # 고가
    - low                # 저가
    - baseVolume         # 거래량 24h