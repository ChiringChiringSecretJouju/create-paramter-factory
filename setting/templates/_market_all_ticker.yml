# =============================================
# Ticker WebSocket Response Projection Fields
# 각 거래소별 ticker 스트림에서 추출할 필드 목록
# =============================================

# --- 한국 거래소 ---
# Upbit, Bithumb은 동일한 WebSocket API 구조 사용 (v2.1.5)
upbit:
  parameter:
    - type              # 타입 (ticker)
    - code              # 마켓 코드 (KRW-BTC)
    - trade_timestamp   # 체결 타임스탬프 (ms)
    - trade_price       # 현재가
    - opening_price     # 시가
    - high_price        # 고가
    - low_price         # 저가
    - prev_closing_price  # 전일 종가
    - change            # 전일 대비 (RISE/EVEN/FALL)
    - change_price      # 변화량
    - change_rate       # 변화율
    - trade_volume      # 최근 거래량
    - acc_trade_volume  # 누적 거래량 (UTC 0시 기준)
    - acc_trade_volume_24h  # 24시간 누적 거래량
    - acc_trade_price   # 누적 거래대금 (UTC 0시 기준)
    - acc_trade_price_24h   # 24시간 누적 거래대금
    - timestamp         # 타임스탬프

bithumb:
  # Bithumb v2.1.5 WebSocket은 Upbit과 동일한 필드 사용
  parameter:
    - type              # 타입 (ticker)
    - code              # 마켓 코드 (KRW-BTC)
    - trade_timestamp   # 체결 타임스탬프 (ms)
    - trade_price       # 현재가
    - opening_price     # 시가
    - high_price        # 고가
    - low_price         # 저가
    - prev_closing_price  # 전일 종가
    - change            # 전일 대비 (RISE/EVEN/FALL)
    - change_price      # 변화량
    - change_rate       # 변화율
    - trade_volume      # 최근 거래량
    - acc_trade_volume  # 누적 거래량 (UTC 0시 기준)
    - acc_trade_volume_24h  # 24시간 누적 거래량
    - acc_trade_price   # 누적 거래대금 (UTC 0시 기준)
    - acc_trade_price_24h   # 24시간 누적 거래대금
    - timestamp         # 타임스탬프

coinone:
  # Coinone은 data 객체 안에 필드가 있음
  # 축약형(SHORT format)도 함께 표기
  parameter:
    - response_type     # (r) DATA로 고정
    - channel           # (c) TICKER로 고정
    - quote_currency    # (qc) 마켓 기준 통화 (KRW)
    - target_currency   # (tc) 조회한 종목의 심볼 (BTC)
    - timestamp         # (t) 타임스탬프 (ms)
    - quote_volume      # (qv) 24시간 거래대금 (원화)
    - target_volume     # (tv) 24시간 거래량 (종목)
    - high              # (hi) 고가 (UTC 기준)
    - low               # (lo) 저가 (UTC 기준)
    - first             # (fi) 시가
    - last              # (la) 현재가 (종가)
    - volume_power      # (vp) 체결 강도
    - ask_best_price    # (abp) 매도 1호가
    - ask_best_qty      # (abq) 매도 1호가 잔량
    - bid_best_price    # (bbp) 매수 1호가
    - bid_best_qty      # (bbq) 매수 1호가 잔량
    - id                # (i) 고유 ID
    - yesterday_high    # (yhi) 전일 고가
    - yesterday_low     # (ylo) 전일 저가
    - yesterday_first   # (yfi) 전일 시가
    - yesterday_last    # (yla) 전일 종가
    - yesterday_quote_volume  # (yqv) 전일 거래대금
    - yesterday_target_volume # (ytv) 전일 거래량

korbit:
  # Korbit은 data 객체 안에 필드가 있음
  parameter:
    - type              # 타입 (ticker)
    - timestamp         # 서버 시간 (Unix Timestamp ms)
    - symbol            # 거래쌍 (btc_krw)
    - snapshot          # 스냅샷 여부
    # data 객체 내부 필드
    - open              # 시가
    - high              # 고가
    - low               # 저가
    - close             # 종가 (현재가)
    - prevClose         # 전일 종가
    - priceChange       # 가격 변화량
    - priceChangePercent  # 가격 변화율
    - volume            # 거래량
    - quoteVolume       # 거래대금
    - bestAskPrice      # 매도 1호가
    - bestBidPrice      # 매수 1호가
    - lastTradedAt      # 마지막 체결 시각

# --- 글로벌 거래소 ---
# 공식 문서: https://developers.binance.com/docs/binance-spot-api-docs/web-socket-streams
binance:
  # Stream Name: <symbol>@ticker (24hrTicker)
  # Update Speed: 1000ms
  parameter:
    - e                 # Event type (24hrTicker)
    - E                 # Event time
    - s                 # Symbol
    - p                 # Price change
    - P                 # Price change percent
    - w                 # Weighted average price
    - x                 # First trade(F)-1 price (before 24hr rolling window)
    - c                 # Last price
    - Q                 # Last quantity
    - b                 # Best bid price
    - B                 # Best bid quantity
    - a                 # Best ask price
    - A                 # Best ask quantity
    - o                 # Open price
    - h                 # High price
    - l                 # Low price
    - v                 # Total traded base asset volume
    - q                 # Total traded quote asset volume
    - O                 # Statistics open time
    - C                 # Statistics close time
    - F                 # First trade ID
    - L                 # Last trade ID
    - "n"               # Total number of trades

# 공식 문서: https://bybit-exchange.github.io/docs/v5/websocket/public/ticker
bybit:
  # Topic: tickers.{symbol}
  # Spot ticker response fields
  parameter:
    # Top-level fields
    - topic             # Topic name (tickers.BTCUSDT)
    - ts                # Timestamp (ms)
    - type              # snapshot / delta
    - cs                # Cross sequence
    # Data object fields
    - symbol            # Symbol name
    - lastPrice         # Last price
    - highPrice24h      # High price (24h)
    - lowPrice24h       # Low price (24h)
    - prevPrice24h      # Previous price (24h)
    - volume24h         # Volume (24h)
    - turnover24h       # Turnover (24h)
    - price24hPcnt      # Price change percentage (24h)
    - usdIndexPrice     # USD index price

# 공식 문서: https://www.okx.com/docs-v5/en/#order-book-trading-market-data-ws-tickers-channel
okx:
  # Channel: tickers
  # Push Data fields
  parameter:
    - instType          # Instrument type (SPOT, MARGIN, etc.)
    - instId            # Instrument ID (BTC-USDT)
    - last              # Last traded price
    - lastSz            # Last traded size
    - askPx             # Best ask price
    - askSz             # Best ask size
    - bidPx             # Best bid price
    - bidSz             # Best bid size
    - open24h           # Open price in the past 24h
    - high24h           # High price in the past 24h
    - low24h            # Low price in the past 24h
    - volCcy24h         # 24h trading volume (quote currency - USDT)
    - vol24h            # 24h trading volume (base currency)
    - sodUtc0           # Open price at 0:00 UTC
    - sodUtc8           # Open price at 0:00 UTC+8
    - ts                # Data generation time (ms)

